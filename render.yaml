services:
  - type: web
    name: driftlock
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      # Render terminates TLS in front of the app. Without this the throttle
      # keys off the proxy's address and every visitor shares one bucket.
      - key: DRIFTLOCK_NUM_PROXIES
        value: "1"
      # The pipeline reads the demo storefront over real HTTP, so it needs to
      # know its own public address.
      - key: DRIFTLOCK_DEMO_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # SQLite inside the instance; see gunicorn.conf.py. Overrides the
      # DATABASE_URL the free Postgres left behind (Render deletes those
      # after 30 days).
      - key: DATABASE_ENGINE
        value: sqlite
