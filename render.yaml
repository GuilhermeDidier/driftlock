services:
  - type: web
    name: driftlock
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      # The pipeline reads the demo storefront over real HTTP, so it needs to
      # know its own public address.
      - key: DRIFTLOCK_DEMO_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: driftlock-db
          property: connectionString

databases:
  - name: driftlock-db
    plan: free
